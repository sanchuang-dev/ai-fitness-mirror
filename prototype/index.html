<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0908">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MIRRA · 智能健身镜</title>
<style>
  :root {
    --bg: #0b0a08;
    --text: #f4efe7;
    --muted: #a99d8c;
    --faint: #8a8074;
    --line: rgba(216, 185, 130, .18);
    --line-strong: rgba(216, 185, 130, .40);
    --gold: #d8b982;
    --mint: #7fe3b4;
    --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
    --condensed: "Avenir Next Condensed", "DIN Condensed", "PingFang SC", sans-serif;
    --num: "DIN Alternate", "Avenir Next Condensed", "SF Mono", Menlo, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #050504;
    color: var(--text);
    font-family: var(--font);
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  .boot {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 1080px;
    height: 1920px;
    transform: translate(-50%, -50%) scale(var(--s, 1));
    transform-origin: center center;
    overflow: hidden;
    background:
      radial-gradient(1100px 900px at 50% 8%, #1b1712 0%, #0d0b09 56%, #080706 100%);
    display: flex;
    flex-direction: column;
    padding: 92px 96px 96px;
  }

  .boot::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(115deg, transparent 18%, rgba(255,255,255,.04) 34%, transparent 47%),
      linear-gradient(180deg, rgba(255,255,255,.03), transparent 22%);
  }

  .boot__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 40px; }

  .lockup { display: grid; gap: 12px; }
  .lockup__name {
    font-family: var(--serif); font-size: 38px; font-weight: 500;
    letter-spacing: .44em; line-height: 1; color: var(--text); text-indent: .44em;
  }
  .lockup__sub { font-size: 15px; letter-spacing: .42em; color: var(--muted); text-indent: .42em; }

  .status { display: grid; gap: 10px; justify-items: end; text-align: right; }
  .status__time { font-family: var(--num); font-size: 46px; line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; }
  .status__meta { display: inline-flex; align-items: center; gap: 12px; font-size: 19px; letter-spacing: .2em; color: var(--muted); }
  .status__meta i { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); display: block; animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  .boot__mid { margin-top: 150px; }
  .boot__mid h1 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 104px; line-height: 1.3; }
  .boot__mid h1 b { font-weight: 500; }
  .boot__mid p { margin: 26px 0 0; font-size: 28px; line-height: 1.8; color: var(--muted); max-width: 30ch; }

  .editions { margin-top: 92px; display: grid; gap: 26px; }
  .edition {
    position: relative; display: flex; align-items: center; justify-content: space-between;
    gap: 32px; width: 100%; min-height: 232px; padding: 40px 46px;
    border: 1px solid var(--line); border-radius: 6px;
    background: rgba(30, 25, 20, .55);
    color: var(--text); text-align: left; cursor: pointer;
    transition: border-color .18s, background-color .18s, transform .18s;
    text-decoration: none;
  }
  .edition:active { transform: scale(.992); }
  .edition:focus-visible { outline: none; box-shadow: 0 0 0 3px #0b0a08, 0 0 0 6px var(--gold); }
  .edition--gym:focus-visible { box-shadow: 0 0 0 3px #0b0a08, 0 0 0 6px var(--mint); }

  .edition__text { display: grid; gap: 14px; }
  .edition__kicker { font-size: 17px; letter-spacing: .3em; color: var(--gold); }
  .edition--gym .edition__kicker { color: var(--mint); }
  .edition__name { font-family: var(--serif); font-size: 56px; font-weight: 500; letter-spacing: .04em; line-height: 1.2; }
  .edition--gym .edition__name { font-family: var(--condensed); font-weight: 600; }
  .edition__desc { font-size: 22px; letter-spacing: .06em; color: var(--muted); }

  .edition__go {
    width: 92px; height: 92px; flex: none; border-radius: 50%;
    border: 1px solid var(--line-strong); display: grid; place-items: center;
    color: var(--gold);
  }
  .edition--gym .edition__go { color: var(--mint); border-radius: 4px; }

  @media (hover: hover) {
    .edition:hover { border-color: var(--line-strong); background: rgba(40, 33, 26, .62); }
  }

  .boot__foot {
    margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between;
    gap: 30px; font-size: 18px; letter-spacing: .2em; color: var(--faint);
  }
  .boot__foot span { display: block; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<main class="boot" id="boot">
  <div class="boot__top">
    <div class="lockup" aria-label="MIRRA Smart Fitness Mirror">
      <span class="lockup__name">MIRRA</span>
      <span class="lockup__sub">SMART FITNESS MIRROR</span>
    </div>
    <div class="status">
      <span class="status__time" id="clock">--:--</span>
      <span class="status__meta"><i aria-hidden="true"></i><span id="today">设备就绪</span></span>
    </div>
  </div>

  <div class="boot__mid">
    <h1>选择<b>场馆版本</b></h1>
    <p>触控进入对应场景，之后的所有操作都在镜面上完成。</p>
  </div>

  <nav class="editions" aria-label="选择场馆版本">
    <a class="edition" id="linkHotel" href="hotel.html">
      <span class="edition__text">
        <span class="edition__kicker">HOTEL EDITION</span>
        <span class="edition__name">酒店版</span>
        <span class="edition__desc">安静、低门槛的拉伸与放松 · 无需登录</span>
      </span>
      <span class="edition__go" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </span>
    </a>

    <a class="edition edition--gym" id="linkGym" href="gym.html">
      <span class="edition__text">
        <span class="edition__kicker">GYM EDITION</span>
        <span class="edition__name">健身房版</span>
        <span class="edition__desc">分组训练、组间休息与大号倒计时</span>
      </span>
      <span class="edition__go" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </span>
    </a>
  </nav>

  <footer class="boot__foot">
    <span>MIRRA · 镜面本机运行</span>
    <span>竖屏 9:16 · 全屏触控</span>
  </footer>
</main>

<script src="assets/mirror.js"></script>
<script>
(function () {
  'use strict';
  var M = window.MIRRA;
  M.initScale();
  M.kiosk();

  var params = new URLSearchParams(location.search);
  var edition = (params.get('edition') || '').toLowerCase();

  /* On a deployed mirror the edition is fixed at install time:
     index.html                 → this chooser (on-site setup)
     index.html?edition=hotel   → boots straight into the hotel app
     index.html?edition=gym     → boots straight into the gym app */
  if (edition === 'hotel') { location.replace('hotel.html'); return; }
  if (edition === 'gym') { location.replace('gym.html'); return; }

  var clock = document.getElementById('clock');
  var today = document.getElementById('today');

  function paint() {
    var d = new Date();
    clock.textContent = M.clockLabel(d);
    today.textContent = M.dateLabel(d);
  }
  paint();
  setInterval(paint, 10000);

})();
</script>
</body>
</html>
