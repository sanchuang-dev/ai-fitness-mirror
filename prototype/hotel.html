<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14100b">
<title>Aurelia · Smart Fitness Mirror 酒店版</title>
<link rel="stylesheet" href="assets/mirror.css">
<style>
  /* ---------- hotel scene (暮色温泉 · 暖棕 / 香槟金) ---------- */

  .h-standby { position: relative; height: 100%; overflow: hidden; cursor: pointer; }
  .h-standby__bg { position: absolute; inset: 0; }
  .h-standby__bg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; filter: saturate(.82) brightness(.72); }
  .h-standby__scrim {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 70% at 50% 18%, rgba(20,16,11,.10) 0%, rgba(20,16,11,.62) 62%, rgba(14,11,8,.94) 100%),
      linear-gradient(180deg, rgba(16,12,9,.86) 0%, rgba(16,12,9,.18) 34%, rgba(14,11,8,.55) 68%, rgba(12,9,7,.96) 100%);
  }
  .h-standby__inner {
    position: relative; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 88px 96px 92px;
  }

  .lockup { display: flex; flex-direction: column; gap: 10px; }
  .lockup__name {
    font-family: var(--font-display); font-size: 36px; font-weight: 500;
    letter-spacing: .42em; line-height: 1; color: var(--text); text-indent: .42em;
  }
  .lockup__sub { font-size: 15px; letter-spacing: .46em; color: var(--muted); text-indent: .46em; }

  .h-standby__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 40px; }
  .h-standby__weather { text-align: right; display: grid; gap: 8px; }
  .h-standby__weather span { font-size: 20px; letter-spacing: .16em; color: var(--muted); }

  .h-clock { text-align: center; margin-top: 40px; }
  .h-clock__time {
    font-family: var(--font-display);
    font-size: 240px; line-height: .92; font-weight: 400;
    letter-spacing: -.01em; font-variant-numeric: tabular-nums;
    color: #fbf6ec; text-shadow: 0 4px 60px rgba(0,0,0,.35);
  }
  .h-clock__date { margin-top: 26px; font-size: 26px; letter-spacing: .3em; color: var(--muted); text-indent: .3em; }

  .h-standby__foot { display: flex; flex-direction: column; align-items: center; gap: 34px; min-height: 210px; justify-content: flex-end; }
  .h-wakecopy { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .h-wakecopy .display { font-size: 52px; }
  .h-wakecopy p { margin: 0; font-size: 25px; color: var(--muted); letter-spacing: .06em; }
  .h-hint { display: inline-flex; align-items: center; gap: 14px; font-size: 22px; letter-spacing: .22em; color: var(--muted); }
  .h-hint .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: softPulse 3.2s ease-in-out infinite; }
  @keyframes softPulse { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }

  .h-standby[data-state="dormant"] .h-standby__foot .btn,
  .h-standby[data-state="dormant"] .h-wakecopy { display: none; }
  .h-standby[data-state="awake"] .h-hint { display: none; }

  /* ---------- home ---------- */

  .h-screen { display: flex; flex-direction: column; gap: 0; height: 100%; padding: 76px 84px 74px; }

  .h-topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 32px; }
  .h-topbar .lockup__name { font-size: 24px; letter-spacing: .4em; }
  .h-topbar .lockup__sub { font-size: 12px; letter-spacing: .4em; }
  .h-topbar__right { display: flex; align-items: center; gap: 26px; }
  .h-topbar__time { font-size: 26px; letter-spacing: .12em; color: var(--muted); font-variant-numeric: tabular-nums; }

  .h-greeting { margin-top: 78px; }
  .h-greeting .eyebrow { margin-bottom: 26px; }
  .h-greeting .display { font-size: 96px; }

  .h-hero {
    position: relative; margin-top: 58px; height: 560px; overflow: hidden;
    border-radius: var(--r-card); border: 1px solid var(--line);
    background: var(--bg-2); text-align: left;
    padding: 0; cursor: pointer; display: block; width: 100%;
    transition: transform .2s cubic-bezier(.4,0,.2,1);
  }
  .h-hero:active { transform: scale(.995); }
  .h-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 38%; }
  .h-hero__scrim {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(16,12,9,.88) 0%, rgba(16,12,9,.42) 52%, rgba(16,12,9,.06) 100%),
                linear-gradient(180deg, rgba(16,12,9,.18) 0%, transparent 40%, rgba(16,12,9,.5) 100%);
  }
  .h-hero__body {
    position: relative; height: 100%; padding: 46px 48px;
    display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  }
  .h-hero__tag { display: inline-flex; align-items: center; gap: 12px; font-size: 18px; letter-spacing: .26em; color: var(--accent); }
  .h-hero__tag::before { content: ""; width: 34px; height: 1px; background: var(--accent); opacity: .7; }
  .h-hero__title { display: block; margin: 0; font-family: var(--font-display); font-size: 72px; line-height: 1.3; color: #fdf8ef; }
  .h-hero__meta { margin-top: 14px; font-size: 24px; color: rgba(250,243,232,.78); letter-spacing: .1em; }
  .h-hero__cta {
    display: inline-flex; align-items: center; gap: 18px;
    padding: 20px 34px; border-radius: 999px;
    border: 1px solid rgba(236,211,162,.55); background: rgba(20,15,10,.35);
    color: #f6ead6; font-size: 24px; letter-spacing: .14em;
    backdrop-filter: blur(2px);
  }

  .h-section { margin-top: 56px; display: flex; align-items: baseline; justify-content: space-between; }
  .h-section h2 { margin: 0; font-family: var(--font-display); font-size: 40px; font-weight: 500; letter-spacing: .04em; }
  .h-section__more {
    display: inline-flex; align-items: center; gap: 8px; background: none; border: 0;
    color: var(--muted); font-size: 23px; letter-spacing: .14em; cursor: pointer; padding: 12px 0 12px 20px;
  }
  .h-section__more:hover { color: var(--accent); }

  .h-cscroll { margin-top: 6px; flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }

  .h-list { margin-top: 20px; display: flex; flex-direction: column; }
  .h-row {
    display: flex; align-items: center; gap: 30px; width: 100%;
    padding: 22px 8px; border: 0; border-bottom: 1px solid var(--line);
    background: none; text-align: left; cursor: pointer;
    transition: background-color .16s;
  }
  .h-row:hover { background: rgba(216,185,130,.05); }
  .h-row:active { background: rgba(216,185,130,.09); }
  .h-row__thumb { display: block; width: 104px; height: 104px; border-radius: 4px; overflow: hidden; flex: none; background: var(--bg-2); }
  .h-row__thumb img { width: 100%; height: 100%; object-fit: cover; }
  .h-row__body { flex: 1 1 auto; min-width: 0; display: grid; gap: 10px; }
  .h-row__title { font-family: var(--font-display); font-size: 36px; letter-spacing: .05em; color: var(--text); }
  .h-row__meta { font-size: 21px; color: var(--faint); letter-spacing: .08em; }
  .h-row__go { color: var(--faint); flex: none; display: flex; }
  .h-row:hover .h-row__go { color: var(--accent); }

  .h-pending {
    margin-top: 26px; width: 100%; display: flex; align-items: center; gap: 22px;
    padding: 22px 26px; border: 1px solid var(--line-strong); border-radius: var(--r-card);
    background: rgba(216,185,130,.06); color: var(--text); text-align: left; cursor: pointer;
    transition: background-color .16s;
  }
  .h-pending:hover { background: rgba(216,185,130,.12); }
  .h-pending > span:first-child { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; color: var(--accent); flex: none; }
  .h-pending > span:nth-child(2) { flex: 1 1 auto; display: grid; gap: 4px; }
  .h-pending b { font-family: var(--font-display); font-size: 28px; font-weight: 500; letter-spacing: .04em; }
  .h-pending em { font-style: normal; font-size: 19px; color: var(--faint); letter-spacing: .06em; }
  .h-pending > .od-icon { color: var(--faint); flex: none; }

  .h-quiet { margin-top: auto; padding-top: 24px; display: flex; justify-content: center; }
  .h-quiet button {
    border: 0; background: none; color: var(--faint); font-size: 21px; letter-spacing: .2em;
    padding: 18px 26px; cursor: pointer;
  }
  .h-quiet button:hover { color: var(--muted); }

  /* ---------- course list ---------- */

  .h-listhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; margin-top: 56px; }
  .h-listhead .display { font-size: 76px; }
  .h-filters { display: flex; gap: 16px; margin-top: 36px; }

  .h-grid { margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; padding-bottom: 40px; }
  .h-card {
    display: flex; flex-direction: column; gap: 0; padding: 0; border: 1px solid var(--line);
    border-radius: var(--r-card); overflow: hidden; background: var(--surface);
    text-align: left; cursor: pointer; transition: transform .2s, border-color .2s;
  }
  .h-card:hover { border-color: var(--line-strong); transform: translateY(-3px); }
  .h-card__media { position: relative; display: block; width: 100%; aspect-ratio: 1 / 1; overflow: hidden; }
  .h-card__media img { width: 100%; height: 100%; object-fit: cover; }
  .h-card__media::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 52%, rgba(14,11,8,.86) 100%);
  }
  .h-card__badge {
    position: absolute; top: 22px; left: 22px; z-index: 2;
    padding: 9px 18px; border-radius: 999px;
    background: rgba(18,13,9,.55); border: 1px solid rgba(216,185,130,.36);
    font-size: 17px; letter-spacing: .16em; color: #f0e3cd; backdrop-filter: blur(3px);
  }
  .h-card__dur {
    position: absolute; right: 22px; bottom: 20px; z-index: 2;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 20px; letter-spacing: .08em; color: rgba(250,243,232,.9);
  }
  .h-card__body { padding: 26px 26px 30px; display: grid; gap: 10px; }
  .h-card__title { font-family: var(--font-display); font-size: 38px; letter-spacing: .04em; color: var(--text); }
  .h-card__meta { font-size: 20px; color: var(--faint); letter-spacing: .1em; }

  .h-empty { grid-column: 1 / -1; padding: 120px 40px; text-align: center; display: grid; justify-items: center; gap: 22px; }
  .h-empty__mark { width: 120px; height: 120px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; color: var(--faint); }
  .h-empty h3 { margin: 0; font-family: var(--font-display); font-size: 40px; font-weight: 500; }
  .h-empty p { margin: 0; font-size: 23px; color: var(--faint); line-height: 1.7; }

  /* ---------- detail ---------- */

  .d-wrap { height: 100%; overflow-y: auto; overscroll-behavior: contain; }
  .d-hero { position: relative; height: 1080px; overflow: hidden; }
  .d-hero img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 34%; }
  .d-hero__scrim {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(14,11,8,.62) 0%, rgba(14,11,8,.06) 30%, rgba(14,11,8,.30) 62%, rgba(20,16,11,.96) 100%);
  }
  .d-hero__top { position: absolute; top: 0; left: 0; right: 0; padding: 66px 84px; display: flex; justify-content: space-between; align-items: center; }
  .d-hero__top .icon-btn { background: rgba(16,12,9,.42); }
  .d-hero__text { position: absolute; left: 84px; right: 84px; bottom: 74px; }
  .d-hero__text .eyebrow { margin-bottom: 20px; color: var(--accent); }
  .d-hero__text h1 { margin: 0; font-family: var(--font-display); font-size: 104px; font-weight: 500; line-height: 1.3; color: #fdf8ef; }
  .d-hero__sub { margin-top: 20px; font-size: 26px; letter-spacing: .16em; color: rgba(250,243,232,.8); }

  .d-body { background: var(--bg); padding: 0 84px 300px; }
  .d-stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .d-stat { padding: 36px 0 34px; display: grid; gap: 8px; }
  .d-stat + .d-stat { border-left: 1px solid var(--line); padding-left: 34px; }
  .d-stat__label { font-size: 18px; letter-spacing: .22em; color: var(--faint); }
  .d-stat__value { font-family: var(--font-display); font-size: 40px; color: var(--text); }

  .d-block { margin-top: 56px; }
  .d-block h2 { margin: 0 0 20px; font-size: 19px; letter-spacing: .3em; color: var(--accent); font-weight: 500; }
  .d-block p { margin: 0; font-size: 29px; line-height: 1.85; color: var(--muted); max-width: 34ch; }
  .d-note { margin-top: 20px; display: flex; gap: 12px; font-size: 21px; color: var(--faint); letter-spacing: .04em; }

  .d-phases { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  .d-phases li { display: flex; align-items: center; gap: 24px; padding: 26px 0; border-bottom: 1px solid var(--line); }
  .d-phases__idx { width: 44px; flex: none; font-size: 19px; color: var(--faint); letter-spacing: .1em; font-variant-numeric: tabular-nums; }
  .d-phases__name { flex: 1 1 auto; font-size: 30px; color: var(--text); letter-spacing: .05em; }
  .d-phases__dur { font-size: 22px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .d-cta {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 84px 56px;
    background: linear-gradient(180deg, rgba(20,16,11,0) 0%, rgba(20,16,11,.94) 42%, #14100b 100%);
    display: flex; gap: 20px; align-items: center;
  }

  /* ---------- loading ---------- */

  .h-loading { position: relative; height: 100%; display: grid; place-items: center; overflow: hidden; }
  .h-loading img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(26px) brightness(.42) saturate(.8); transform: scale(1.08); }
  .h-loading__veil { position: absolute; inset: 0; background: radial-gradient(80% 60% at 50% 50%, rgba(20,16,11,.5), rgba(12,9,7,.95)); }
  .h-loading__inner { position: relative; display: grid; justify-items: center; gap: 30px; text-align: center; }
  .h-ring { width: 92px; height: 92px; border-radius: 50%; border: 1px solid rgba(216,185,130,.25); border-top-color: var(--accent); animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .h-loading__title { font-family: var(--font-display); font-size: 42px; color: var(--text); letter-spacing: .1em; }
  .h-loading__sub { font-size: 23px; color: var(--muted); letter-spacing: .18em; }

  /* ---------- training ---------- */

  .t-stage { position: relative; height: 100%; overflow: hidden; background: #0d0906; }
  .t-stage__media { position: absolute; inset: 0; }
  .t-stage__media img {
    width: 100%; height: 100%; object-fit: cover; object-position: 50% 38%;
    animation: slowDrift 42s ease-in-out infinite alternate;
    filter: saturate(.86) brightness(.86);
  }
  @keyframes slowDrift { from { transform: scale(1.02); } to { transform: scale(1.10) translateY(-1.2%); } }
  .t-stage__scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(12,9,7,.82) 0%, rgba(12,9,7,.10) 24%, rgba(12,9,7,0) 46%, rgba(12,9,7,.62) 74%, rgba(12,9,7,.96) 100%);
  }
  .t-stage__vignette { position: absolute; inset: 0; box-shadow: inset 0 0 220px rgba(0,0,0,.55); }

  .t-top { position: relative; display: flex; align-items: flex-start; justify-content: space-between; padding: 66px 84px 0; gap: 24px; }
  .t-top__exit { display: inline-flex; align-items: center; gap: 16px; border: 0; background: none; color: rgba(247,240,229,.86); font-size: 24px; letter-spacing: .12em; padding: 22px 18px; margin-left: -18px; cursor: pointer; border-radius: 999px; }
  .t-top__exit:hover { color: #fff; background: rgba(255,255,255,.06); }
  .t-top__course { text-align: right; display: grid; gap: 8px; }
  .t-top__course span:first-child { font-size: 17px; letter-spacing: .26em; color: var(--muted); }
  .t-top__course span:last-child { font-family: var(--font-display); font-size: 30px; letter-spacing: .08em; color: var(--text); }

  .t-bottom { position: absolute; left: 84px; right: 84px; bottom: 84px; display: flex; flex-direction: column; gap: 34px; }
  .t-phase { display: grid; gap: 16px; }
  .t-phase__label { font-size: 20px; letter-spacing: .26em; color: var(--accent); }
  .t-phase__name { font-family: var(--font-display); font-size: 88px; line-height: 1.3; color: #fdf8ef; letter-spacing: .04em; }
  .t-phase__cue { font-size: 24px; color: rgba(247,240,229,.66); letter-spacing: .06em; max-width: 26ch; }

  .t-time { display: flex; align-items: flex-end; gap: 26px; }
  .t-time__value { font-family: var(--font-display); font-size: 96px; line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  .t-time__label { font-size: 20px; letter-spacing: .24em; color: var(--muted); padding-bottom: 14px; }

  .t-controls { display: flex; align-items: center; justify-content: space-between; gap: 30px; margin-top: 6px; }
  .t-progress { flex: 1 1 auto; display: grid; gap: 16px; }
  .t-progress__meta { display: flex; justify-content: space-between; font-size: 19px; letter-spacing: .16em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .t-pause {
    width: 132px; height: 132px; flex: none; border-radius: 50%;
    border: 1px solid rgba(236,211,162,.4); background: rgba(20,15,10,.42);
    color: var(--text); display: grid; place-items: center; cursor: pointer;
    backdrop-filter: blur(4px); transition: transform .16s, background-color .16s;
  }
  .t-pause:hover { background: rgba(216,185,130,.18); }
  .t-pause:active { transform: scale(.94); }
  .t-pause:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(12,9,7,.9), 0 0 0 6px var(--focus); }
  .t-tapzone { position: absolute; inset: 0; cursor: pointer; }

  /* paused dims the scene behind the control layer */
  .t-stage.is-paused .t-stage__media { filter: brightness(.55); }
  .t-stage.is-paused .t-stage__media img { animation-play-state: paused; }

  .t-sheet .sheet__title { font-size: 52px; }
  .t-sheet__phase { display: flex; align-items: center; gap: 18px; padding: 22px 26px; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 34px; }
  .t-sheet__phase span:first-child { font-size: 17px; letter-spacing: .22em; color: var(--accent); }
  .t-sheet__phase span:last-child { font-family: var(--font-display); font-size: 32px; }

  /* ---------- complete ---------- */

  .h-done { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 96px; text-align: center; overflow: hidden; }
  .h-done__bg { position: absolute; inset: 0; }
  .h-done__bg img { width: 100%; height: 100%; object-fit: cover; filter: brightness(.28) saturate(.7); }
  .h-done__veil { position: absolute; inset: 0; background: radial-gradient(70% 55% at 50% 42%, rgba(28,21,14,.55), rgba(12,9,7,.97) 78%); }
  .h-done__inner { position: relative; display: grid; justify-items: center; }
  .h-done__seal {
    width: 176px; height: 176px; border-radius: 50%;
    border: 1px solid rgba(216,185,130,.5);
    display: grid; place-items: center; color: var(--accent);
    position: relative; margin-bottom: 54px;
  }
  .h-done__seal::before {
    content: ""; position: absolute; inset: 10px; border-radius: 50%;
    border: 1px solid rgba(216,185,130,.18);
  }
  .h-done h1 { margin: 0; font-family: var(--font-display); font-size: 86px; font-weight: 500; line-height: 1.32; color: #fdf8ef; }
  .h-done__course { margin-top: 18px; font-size: 26px; letter-spacing: .2em; color: var(--accent); }
  .h-done__stats { margin-top: 64px; display: flex; align-items: stretch; gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); width: 100%; max-width: 720px; }
  .h-done__stat { flex: 1 1 0; padding: 32px 12px; display: grid; gap: 10px; }
  .h-done__stat + .h-done__stat { border-left: 1px solid var(--line); }
  .h-done__stat b { font-family: var(--font-display); font-size: 46px; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
  .h-done__stat span { font-size: 18px; letter-spacing: .2em; color: var(--faint); }
  .h-done__actions { margin-top: 76px; display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 560px; }

  /* ---------- shared system states ---------- */

  .h-state { position: relative; height: 100%; display: grid; place-items: center; padding: 84px 96px; text-align: center; overflow: hidden; }
  .h-state__bg { position: absolute; inset: 0; }
  .h-state__bg img { width: 100%; height: 100%; object-fit: cover; filter: blur(22px) brightness(.3) saturate(.7); transform: scale(1.06); }
  .h-state__veil { position: absolute; inset: 0; background: radial-gradient(70% 55% at 50% 46%, rgba(22,17,11,.62), rgba(12,9,7,.96) 80%); }
  .h-state__inner { position: relative; display: grid; justify-items: center; gap: 26px; max-width: 720px; }
  .h-state__mark { width: 132px; height: 132px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; color: var(--accent); margin-bottom: 10px; }
  .h-state h1 { margin: 0; font-family: var(--font-display); font-size: 62px; font-weight: 500; line-height: 1.36; }
  .h-state p { margin: 0; font-size: 26px; line-height: 1.8; color: var(--muted); max-width: 28ch; }
  .h-state__actions { margin-top: 34px; display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 480px; }
  .h-state__meta { margin-top: 8px; font-size: 19px; letter-spacing: .18em; color: var(--faint); }

  /* focus ring on dark photo */
  .h-hero:focus-visible,
  .h-card:focus-visible,
  .h-row:focus-visible,
  .h-section__more:focus-visible,
  .h-quiet button:focus-visible,
  .t-top__exit:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(20,16,11,.9), 0 0 0 6px var(--focus);
  }

  .h-pointer { color: var(--faint); }
</style>
</head>
<body data-scene="hotel">
<main class="mirror theme-hotel" id="mirror">
  <div id="app" aria-live="polite"></div>
</main>

<script src="assets/mirror.js"></script>
<script>
(function () {
  'use strict';
  var M = window.MIRRA;
  var IC = M.icon;
  var app = document.getElementById('app');
  var mirror = document.getElementById('mirror');
  M.initScale();
  M.kiosk();

  var S = {
    view: 'standby',
    awake: false,
    course: null,
    filter: '全部',
    segIndex: 0,
    remaining: 0,
    paused: false,
    timer: null,
    loadingTimer: null,
    elapsed: 0,
    exitOpen: false,
    pausedFromTap: false
  };

  var hotelCourses = M.hotelCourses;
  var CATS = ['全部', '晨间', '旅途', '睡前'];

  /* ---------- helpers ---------- */

  function greeting(d) {
    var h = d.getHours();
    if (h < 5) return '夜深了';
    if (h < 11) return '早安';
    if (h < 14) return '午安';
    if (h < 19) return '下午好';
    return '晚上好';
  }

  function lockup(cls) {
    return '<div class="lockup ' + (cls || '') + '" aria-label="' + M.brands.hotel.aria + '">' +
      '<span class="lockup__name">' + M.brands.hotel.name + '</span>' +
      '<span class="lockup__sub">' + M.brands.hotel.sub + '</span>' +
      '</div>';
  }

  function clearTimer() {
    if (S.timer) { clearInterval(S.timer); S.timer = null; }
  }

  function clearLoading() {
    if (S.loadingTimer) { clearTimeout(S.loadingTimer); S.loadingTimer = null; }
  }

  function courseById(id) {
    for (var i = 0; i < hotelCourses.length; i++) if (hotelCourses[i].id === id) return hotelCourses[i];
    return null;
  }

  function setView(v) {
    S.view = v;
    render();
  }

  /* ---------- render ---------- */

  function render() {
    if (S.view !== 'training') clearTimer();
    switch (S.view) {
      case 'standby': app.innerHTML = standbyView(); break;
      case 'home': app.innerHTML = homeView(); break;
      case 'courses': app.innerHTML = coursesView(); break;
      case 'detail': app.innerHTML = detailView(); break;
      case 'loading': app.innerHTML = loadingView(); break;
      case 'training': app.innerHTML = trainingView(); break;
      case 'complete': app.innerHTML = completeView(); break;
      case 'error': app.innerHTML = errorView(); break;
      case 'offline': app.innerHTML = offlineView(); break;
      case 'resume': app.innerHTML = resumeView(); break;
    }
    var screen = app.firstElementChild;
    if (screen) screen.classList.add('screen-enter');
    bindView(screen);
    if (S.view === 'training') {
      renderOverlays();
      startTimer();
    }
  }

  /* ---------- standby ---------- */

  function standbyView() {
    var d = new Date();
    var brandRight = '<div class="h-standby__weather"><span>' + M.clockLabel(d) + '</span><span>室内 24°C</span></div>';
    return '<section class="h-standby" data-state="' + (S.awake ? 'awake' : 'dormant') + '" aria-label="镜面待机">' +
      '<div class="h-standby__bg">' +
        '<img src="assets/stock/hotel_ambience.jpg" alt="" aria-hidden="true">' +
        '<div class="h-standby__scrim"></div>' +
      '</div>' +
      '<div class="h-standby__inner">' +
        '<div class="h-standby__top">' + lockup() + brandRight + '</div>' +
        '<div class="h-clock">' +
          '<div class="h-clock__time">' + M.clockLabel(d) + '</div>' +
          '<div class="h-clock__date">' + M.dateLabel(d) + '</div>' +
        '</div>' +
        '<div class="h-standby__foot">' +
          '<div class="h-wakecopy">' +
            '<p class="eyebrow">A QUIET MOMENT, JUST FOR YOU</p>' +
            '<h1 class="display">' + greeting(d) + '，欢迎回到 Aurelia</h1>' +
            '<p>留十分钟给身体，开始一段安静练习。</p>' +
          '</div>' +
          '<button type="button" class="btn btn--primary btn--lg" data-act="enter" style="min-width:360px">开始体验</button>' +
          '<span class="h-hint"><span class="dot" aria-hidden="true"></span>轻触镜面唤醒</span>' +
        '</div>' +
      '</div>' +
    '</section>';
  }

  /* ---------- home ---------- */

  function homeView() {
    var d = new Date();
    var featured = hotelCourses[0];
    var rest = hotelCourses.slice(1);
    var rows = rest.map(function (c) {
      return '<button type="button" class="h-row" data-course="' + c.id + '">' +
        '<span class="h-row__thumb"><img src="' + c.cover + '" alt="" aria-hidden="true"></span>' +
        '<span class="h-row__body">' +
          '<span class="h-row__title">' + c.title + '</span>' +
          '<span class="h-row__meta">' + M.minuteLabel(M.totalSeconds(c)) + ' · ' + c.level + ' · ' + c.accentNote + '</span>' +
        '</span>' +
        '<span class="h-row__go" aria-hidden="true">' + IC('chevron', 26) + '</span>' +
        '<span class="sr-only">查看课程详情</span>' +
      '</button>';
    }).join('');

    return '<section class="h-screen screen-enter" aria-label="酒店版首页">' +
      '<div class="h-topbar">' + lockup() +
        '<div class="h-topbar__right"><span class="h-topbar__time">' + M.clockLabel(d) + '</span>' +
        '<button type="button" class="btn btn--quiet" data-act="standby">待机</button></div>' +
      '</div>' +
      '<div class="h-greeting">' +
        '<p class="eyebrow">' + M.dateLabel(d) + '</p>' +
        '<h1 class="display">' + greeting(d) + '，<br>让身体慢慢打开</h1>' +
      '</div>' +
      '<button type="button" class="h-hero" data-course="' + featured.id + '" aria-label="开始 ' + featured.title + '，' + M.minuteLabel(M.totalSeconds(featured)) + '">' +
        '<img src="' + featured.cover + '" alt="' + featured.alt + '">' +
        '<span class="h-hero__scrim"></span>' +
        '<span class="h-hero__body">' +
          '<span>' +
            '<span class="h-hero__tag">今日推荐 · ' + featured.accentNote + '</span>' +
            '<span style="display:block;margin-top:26px">' +
              '<span class="h-hero__title">' + featured.title + '</span>' +
              '<span class="h-hero__meta" style="display:block">' + M.minuteLabel(M.totalSeconds(featured)) + ' · ' + featured.level + '</span>' +
            '</span>' +
          '</span>' +
          '<span class="h-hero__cta">' + IC('play', 22) + '开始练习</span>' +
        '</span>' +
      '</button>' +
      '<div class="h-section">' +
        '<h2>为你挑选</h2>' +
        '<button type="button" class="h-section__more" data-act="courses">更多课程 ' + IC('chevron', 22) + '</button>' +
      '</div>' +
      '<div class="h-list">' + rows + '</div>' +
      (S.pending ? '<button type="button" class="h-pending" data-act="continue-pending">' +
        '<span>' + IC('play', 24) + '</span>' +
        '<span><b>继续上次练习</b><em>' + courseById(S.pending.courseId).title + ' · 第 ' + (S.pending.segIndex + 1) + ' 段中断</em></span>' +
        IC('chevron', 24) +
      '</button>' : '') +
      '<div class="h-quiet"><button type="button" data-act="standby">返回镜面待机</button></div>' +
    '</section>';
  }

  /* ---------- courses ---------- */

  function coursesView() {
    var list = hotelCourses.filter(function (c) { return S.filter === '全部' || c.category === S.filter; });
    var chips = CATS.map(function (cat) {
      return '<button type="button" class="chip" data-filter="' + cat + '" aria-pressed="' + (S.filter === cat) + '">' + cat + '</button>';
    }).join('');

    var cards = list.map(function (c) {
      return '<button type="button" class="h-card" data-course="' + c.id + '" aria-label="' + c.title + '，' + M.minuteLabel(M.totalSeconds(c)) + '，' + c.level + '">' +
        '<span class="h-card__media">' +
          '<img src="' + c.cover + '" alt="' + c.alt + '">' +
          '<span class="h-card__badge">' + c.category + '</span>' +
          '<span class="h-card__dur">' + IC('clock', 20) + '<span class="od-nowrap">' + M.minuteLabel(M.totalSeconds(c)) + '</span></span>' +
        '</span>' +
        '<span class="h-card__body">' +
          '<span class="h-card__title">' + c.title + '</span>' +
          '<span class="h-card__meta">' + c.level + ' · ' + M.exerciseCount(c) + ' 个阶段</span>' +
        '</span>' +
      '</button>';
    }).join('');

    var grid = list.length
      ? '<div class="h-grid">' + cards + '</div>'
      : '<div class="h-grid"><div class="h-empty">' +
          '<span class="h-empty__mark">' + IC('clock', 44) + '</span>' +
          '<h3>这一类还没有课程</h3>' +
          '<p>课程内容会随季节更新。<br>可以先看看为你推荐的练习。</p>' +
          '<button type="button" class="btn btn--ghost" data-filter="全部" style="margin-top:12px">查看全部课程</button>' +
        '</div></div>';

    return '<section class="h-screen" aria-label="课程列表">' +
      '<div class="h-topbar">' + lockup() +
        '<div class="h-topbar__right">' +
          '<button type="button" class="btn btn--quiet" data-act="home">返回首页</button>' +
        '</div>' +
      '</div>' +
      '<div class="h-listhead">' +
        '<h1 class="display">课程集</h1>' +
        '<span class="caption">' + list.length + ' 个练习</span>' +
      '</div>' +
      '<div class="h-filters" role="group" aria-label="按类别筛选">' + chips + '</div>' +
      '<div class="h-cscroll">' + grid + '</div>' +
    '</section>';
  }

  /* ---------- detail ---------- */

  function detailView() {
    var c = S.course;
    if (!c) return homeView();
    var total = M.totalSeconds(c);
    var phases = c.phases || [];
    var phaseItems = phases.map(function (p, i) {
      return '<li>' +
        '<span class="d-phases__idx">' + (i + 1 < 10 ? '0' : '') + (i + 1) + '</span>' +
        '<span class="d-phases__name">' + p.name + '</span>' +
        '<span class="d-phases__dur od-nowrap">' + M.fmt(p.seconds) + '</span>' +
      '</li>';
    }).join('');

    return '<section class="screen screen--flush" aria-label="' + c.title + '课程详情">' +
      '<div class="d-wrap">' +
        '<div class="d-hero">' +
          '<img src="' + c.cover + '" alt="' + c.alt + '">' +
          '<div class="d-hero__scrim"></div>' +
          '<div class="d-hero__top">' +
            '<button type="button" class="icon-btn" data-act="back-list" aria-label="返回课程列表">' + IC('back', 30) + '</button>' +
            '<span class="caption" style="color:rgba(250,243,232,.72);letter-spacing:.24em">' + c.en + '</span>' +
          '</div>' +
          '<div class="d-hero__text">' +
            '<p class="eyebrow">' + c.category + ' · ' + c.level + '</p>' +
            '<h1>' + c.title + '</h1>' +
            '<p class="d-hero__sub">' + c.goal.split('，')[0] + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="d-body">' +
          '<div class="d-stats">' +
            '<div class="d-stat"><span class="d-stat__label">时长</span><span class="d-stat__value od-nowrap">' + M.minuteLabel(total) + '</span></div>' +
            '<div class="d-stat"><span class="d-stat__label">难度</span><span class="d-stat__value">' + c.level + '</span></div>' +
            '<div class="d-stat"><span class="d-stat__label">阶段</span><span class="d-stat__value od-nowrap">' + phases.length + ' 段</span></div>' +
          '</div>' +
          '<div class="d-block"><h2>关于这节练习</h2><p>' + c.goal + '</p><p style="margin-top:14px">' + c.intro + '</p>' +
            '<div class="d-note">' + IC('check', 20) + '<span>' + c.note + '</span></div>' +
          '</div>' +
          '<div class="d-block"><h2>练习结构</h2>' +
            '<ul class="d-phases">' + phaseItems + '</ul>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="d-cta">' +
        '<button type="button" class="btn btn--primary btn--lg btn--block" data-act="start">开始练习 · ' + M.minuteLabel(total) + '</button>' +
      '</div>' +
    '</section>';
  }

  /* ---------- loading ---------- */

  function loadingView() {
    var c = S.course;
    return '<section class="h-loading" aria-label="正在准备课程">' +
      '<img src="' + c.cover + '" alt="" aria-hidden="true">' +
      '<div class="h-loading__veil"></div>' +
      '<div class="h-loading__inner">' +
        '<span class="h-ring" aria-hidden="true"></span>' +
        '<p class="h-loading__title">正在准备「' + c.title + '」</p>' +
        '<p class="h-loading__sub">调整光线与音量 · 请稍候</p>' +
      '</div>' +
    '</section>';
  }

  /* ---------- training ---------- */

  function segments() { return M.segmentsFor(S.course); }

  function currentSeg() {
    var segs = segments();
    return segs[Math.min(S.segIndex, segs.length - 1)];
  }

  function trainingView() {
    var c = S.course;
    var seg = currentSeg();
    var segs = segments();
    var total = M.totalSeconds(c);
    return '<section class="t-stage" id="stage" aria-label="沉浸式训练">' +
      '<div class="t-stage__media"><img src="' + c.cover + '" alt="教练正在演示' + c.title + '的动作"></div>' +
      '<div class="t-stage__scrim"></div>' +
      '<div class="t-stage__vignette"></div>' +
      '<div class="t-tapzone" data-act="controls" role="button" tabindex="-1" aria-label="显示训练控制"></div>' +
      '<div class="t-top">' +
        '<button type="button" class="t-top__exit" data-act="exit">' + IC('back', 26) + '退出</button>' +
        '<div class="t-top__course"><span>' + c.en + '</span><span>' + c.title + '</span></div>' +
      '</div>' +
      '<div class="t-bottom">' +
        '<div class="t-phase">' +
          '<span class="t-phase__label" id="tLabel">' + (seg.phaseIndex + 1) + ' / ' + seg.phaseCount + ' 阶段</span>' +
          '<h1 class="t-phase__name" id="tName">' + seg.name + '</h1>' +
          '<p class="t-phase__cue" id="tCue">' + (seg.note || '') + '</p>' +
        '</div>' +
        '<div class="t-time"><span class="t-time__value" id="tRemain">' + M.fmt(Math.ceil(S.remaining)) + '</span><span class="t-time__label">剩余</span></div>' +
        '<div class="t-controls">' +
          '<div class="t-progress">' +
            '<div class="progress"><span class="progress-fill" id="tFill"></span></div>' +
            '<div class="t-progress__meta"><span id="tElapsed">已练习 ' + M.fmt(Math.floor(S.elapsed)) + '</span><span id="tTotal">共 ' + M.fmt(total) + '</span></div>' +
          '</div>' +
          '<button type="button" class="t-pause" data-act="pause" aria-label="暂停训练">' + IC('pause', 42) + '</button>' +
        '</div>' +
      '</div>' +
    '</section>';
  }

  function renderOverlays() {
    var host = document.getElementById('stage');
    if (!host) return;
    var old = host.querySelector('.overlay');
    if (old) old.remove();

    if (S.exitOpen) {
      var c = S.course;
      var wrap = document.createElement('div');
      wrap.className = 'overlay';
      wrap.setAttribute('role', 'dialog');
      wrap.setAttribute('aria-modal', 'true');
      wrap.setAttribute('aria-label', '结束本次练习');
      wrap.innerHTML = '<div class="sheet t-sheet">' +
        '<h2 class="sheet__title">结束本次练习？</h2>' +
        '<p class="sheet__text">已完成的阶段不会保留。你随时可以从「' + c.title + '」重新开始。</p>' +
        '<div class="sheet__actions">' +
          '<button type="button" class="btn btn--primary btn--lg" data-act="keep-going">继续练习</button>' +
          '<button type="button" class="btn btn--ghost" data-act="confirm-exit">退出练习</button>' +
        '</div>' +
      '</div>';
      host.appendChild(wrap);
      var first = wrap.querySelector('[data-act="keep-going"]');
      if (first) first.focus();
      return;
    }

    if (S.paused) {
      var seg = currentSeg();
      var segs = segments();
      var isFirst = S.segIndex <= 0;
      var isLast = S.segIndex >= segs.length - 1;
      var wrap2 = document.createElement('div');
      wrap2.className = 'overlay';
      wrap2.setAttribute('role', 'dialog');
      wrap2.setAttribute('aria-modal', 'true');
      wrap2.setAttribute('aria-label', '训练已暂停');
      wrap2.innerHTML = '<div class="sheet t-sheet">' +
        '<p class="eyebrow" style="margin-bottom:18px">PAUSED</p>' +
        '<h2 class="sheet__title">已暂停</h2>' +
        '<div class="t-sheet__phase"><span>当前</span><span>' + seg.name + ' · ' + (seg.phaseIndex + 1) + ' / ' + seg.phaseCount + '</span></div>' +
        '<div class="sheet__actions">' +
          '<button type="button" class="btn btn--primary btn--lg" data-act="resume">继续训练</button>' +
          '<div style="display:flex;gap:18px">' +
            '<button type="button" class="btn btn--ghost od-fill" data-act="prev"' + (isFirst ? ' disabled aria-disabled="true" tabindex="-1"' : '') + '>' + IC('prev', 22) + '上一个</button>' +
            '<button type="button" class="btn btn--ghost od-fill" data-act="next">' + (isLast ? '完成' : '下一个') + IC('next', 22) + '</button>' +
          '</div>' +
          '<button type="button" class="btn btn--quiet" data-act="exit">退出课程</button>' +
        '</div>' +
      '</div>';
      host.appendChild(wrap2);
      var resumeBtn = wrap2.querySelector('[data-act="resume"]');
      if (resumeBtn) resumeBtn.focus();
    }
  }

  function startTimer() {
    clearTimer();
    S.timer = setInterval(tick, 250);
  }

  function tick() {
    if (S.paused || S.view !== 'training') return;
    S.remaining = Math.max(0, S.remaining - 0.25);
    S.elapsed = Math.min(M.totalSeconds(S.course), S.elapsed + 0.25);
    paintTraining();
    if (S.remaining <= 0.01) advancePhase();
  }

  function paintTraining() {
    var seg = currentSeg();
    var segs = segments();
    var total = M.totalSeconds(S.course);
    var fill = document.getElementById('tFill');
    var remain = document.getElementById('tRemain');
    var elapsed = document.getElementById('tElapsed');
    if (!fill) return;
    fill.style.width = Math.min(100, (S.elapsed / total) * 100).toFixed(2) + '%';
    remain.textContent = M.fmt(Math.ceil(S.remaining));
    elapsed.textContent = '已练习 ' + M.fmt(Math.floor(S.elapsed));
    var nameEl = document.getElementById('tName');
    if (nameEl && nameEl.textContent !== seg.name) {
      nameEl.textContent = seg.name;
      var cue = document.getElementById('tCue');
      cue.textContent = seg.note || '';
      var label = document.getElementById('tLabel');
      if (seg.kind === 'rest') label.textContent = '组间休息 · 下一动作 ' + nextWorkName();
      else label.textContent = (seg.phaseIndex + 1) + ' / ' + seg.phaseCount + ' 阶段';
    }
  }

  function nextWorkName() {
    var segs = segments();
    for (var i = S.segIndex + 1; i < segs.length; i++) {
      if (segs[i].kind === 'work') return segs[i].name;
    }
    return '结束';
  }

  function advancePhase() {
    var segs = segments();
    if (S.segIndex + 1 >= segs.length) {
      finishCourse();
      return;
    }
    S.segIndex += 1;
    S.remaining = segs[S.segIndex].seconds;
    paintTraining();
  }

  function goToSegment(i) {
    var segs = segments();
    S.segIndex = Math.max(0, Math.min(i, segs.length - 1));
    S.remaining = segs[S.segIndex].seconds;
    S.paused = false;
    render();
  }

  function finishCourse() {
    clearTimer();
    S.paused = false;
    S.exitOpen = false;
    S.view = 'complete';
    render();
  }

  /* ---------- system states ---------- */

  function stateShell(inner) {
    var c = S.course || hotelCourses[0];
    return '<section class="h-state" aria-label="' + (S.stateTitle || '系统状态') + '">' +
      '<div class="h-state__bg"><img src="' + c.cover + '" alt="" aria-hidden="true"></div>' +
      '<div class="h-state__veil"></div>' +
      '<div class="h-state__inner">' + inner + '</div>' +
    '</section>';
  }

  function errorView() {
    S.stateTitle = '视频暂时无法播放';
    return stateShell(
      '<span class="h-state__mark">' + IC('refresh', 52) + '</span>' +
      '<h1>视频暂时<br>无法播放</h1>' +
      '<p>画面信号中断，课程信息不会丢失。<br>重新载入即可回到刚才的动作。</p>' +
      '<div class="h-state__actions">' +
        '<button type="button" class="btn btn--primary btn--lg" data-act="retry">重新载入</button>' +
        '<button type="button" class="btn btn--ghost" data-act="back-detail">返回课程详情</button>' +
      '</div>' +
      '<span class="h-state__meta">REF 04 · VIDEO STREAM</span>'
    );
  }

  function offlineView() {
    S.stateTitle = '网络不可用';
    return stateShell(
      '<span class="h-state__mark">' + IC('wifiOff', 52) + '</span>' +
      '<h1>网络暂时<br>不可用</h1>' +
      '<p>镜面没有连接到场馆网络。<br>请确认网络已恢复后再试一次。</p>' +
      '<div class="h-state__actions">' +
        '<button type="button" class="btn btn--primary btn--lg" data-act="reconnect">重新连接</button>' +
        '<button type="button" class="btn btn--ghost" data-act="standby">返回待机</button>' +
      '</div>' +
      '<span class="h-state__meta">REF 05 · CONNECTION</span>'
    );
  }

  function resumeView() {
    var c = S.course;
    var segs = M.segmentsFor(c);
    var idx = Math.max(0, Math.min(S.resumeIndex || 0, segs.length - 1));
    var seg = segs[idx];
    S.stateTitle = '继续上次练习';
    return stateShell(
      '<span class="h-state__mark">' + IC('clock', 52) + '</span>' +
      '<h1>继续上次<br>的练习</h1>' +
      '<p>「' + c.title + '」上次练习到<br>' + seg.name + ' · 第 ' + (seg.phaseIndex + 1) + ' / ' + seg.phaseCount + ' 阶段。</p>' +
      '<div class="h-state__actions">' +
        '<button type="button" class="btn btn--primary btn--lg" data-act="resume-course">从断点继续</button>' +
        '<button type="button" class="btn btn--ghost" data-act="start">从开头重新开始</button>' +
      '</div>' +
      '<span class="h-state__meta">REF 06 · SESSION RECOVERY</span>'
    );
  }

  /* ---------- complete ---------- */

  function completeView() {
    var c = S.course;
    var total = M.totalSeconds(c);
    return '<section class="h-done" aria-label="练习完成">' +
      '<div class="h-done__bg"><img src="' + c.cover + '" alt="" aria-hidden="true"></div>' +
      '<div class="h-done__veil"></div>' +
      '<div class="h-done__inner">' +
        '<div class="h-done__seal">' + IC('check', 64) + '</div>' +
        '<h1>练习完成</h1>' +
        '<p class="h-done__course">' + c.title + ' · ' + c.en + '</p>' +
        '<div class="h-done__stats">' +
          '<div class="h-done__stat"><b class="od-nowrap">' + M.minuteLabel(total) + '</b><span>课程时长</span></div>' +
          '<div class="h-done__stat"><b>' + (c.phases ? c.phases.length : M.exerciseCount(c)) + '</b><span>完成阶段</span></div>' +
        '</div>' +
        '<div class="h-done__actions">' +
          '<button type="button" class="btn btn--primary btn--lg" data-act="again">再练一次</button>' +
          '<button type="button" class="btn btn--ghost" data-act="home">返回首页</button>' +
          '<button type="button" class="btn btn--quiet" data-act="standby">返回镜面待机</button>' +
        '</div>' +
      '</div>' +
    '</section>';
  }

  /* ---------- binding ---------- */

  function beginCourse(id) {
    var c = courseById(id);
    if (!c) return;
    clearTimer();
    clearLoading();
    S.course = c;
    S.segIndex = 0;
    S.remaining = 0;
    S.elapsed = 0;
    S.paused = false;
    S.exitOpen = false;
    S.pending = null;
    S.view = 'loading';
    render();
    S.loadingTimer = setTimeout(function () {
      S.loadingTimer = null;
      var segs = M.segmentsFor(c);
      S.segIndex = 0;
      S.remaining = segs[0].seconds;
      S.elapsed = 0;
      S.view = 'training';
      render();
    }, 1500);
  }

  function openCourse(id) {
    var c = courseById(id);
    if (!c) return;
    S.course = c;
    setView('detail');
  }

  function bindView(screen) {
    if (!screen) return;

    if (S.view === 'standby') {
      screen.addEventListener('click', function (e) {
        if (e.target.closest('a')) return;
        if (!S.awake) {
          S.awake = true;
          render();
          return;
        }
        if (e.target.closest('[data-act="enter"]')) {
          S.awake = true;
          setView('home');
        }
      });
      screen.addEventListener('keydown', function (e) {
        if ((e.key === 'Enter' || e.key === ' ') && !S.awake) {
          e.preventDefault();
          S.awake = true;
          render();
        }
      });
      screen.tabIndex = 0;
      return;
    }

    screen.addEventListener('click', function (e) {
      var el = e.target.closest('[data-act], [data-course], [data-filter]');
      if (!el) return;

      if (el.dataset.course) { openCourse(el.dataset.course); return; }

      if (el.dataset.filter) {
        S.filter = el.dataset.filter;
        render();
        return;
      }

      switch (el.dataset.act) {
        case 'enter': setView('home'); break;
        case 'home': clearTimer(); S.awake = true; setView('home'); break;
        case 'standby':
          clearTimer(); clearLoading(); S.paused = false; S.exitOpen = false;
          S.awake = false; S.view = 'standby'; render();
          break;
        case 'courses': S.filter = '全部'; setView('courses'); break;
        case 'back-list': setView('courses'); break;
        case 'start': beginCourse(S.course.id); break;
        case 'again': beginCourse(S.course.id); break;
        case 'pause':
          S.paused = true;
          var st = document.getElementById('stage');
          if (st) st.classList.add('is-paused');
          renderOverlays();
          break;
        case 'resume':
          S.paused = false;
          var st2 = document.getElementById('stage');
          if (st2) st2.classList.remove('is-paused');
          renderOverlays();
          break;
        case 'controls':
          S.paused = true;
          var st3 = document.getElementById('stage');
          if (st3) st3.classList.add('is-paused');
          renderOverlays();
          break;
        case 'prev': goToSegment(S.segIndex - 1); break;
        case 'next':
          if (S.segIndex >= segments().length - 1) finishCourse();
          else goToSegment(S.segIndex + 1);
          break;
        case 'exit': S.exitOpen = true; S.paused = true; renderOverlays(); break;
        case 'keep-going': S.exitOpen = false; S.paused = false; renderOverlays(); break;
        case 'confirm-exit':
          clearTimer();
          S.exitOpen = false; S.paused = false;
          S.pending = { courseId: S.course.id, segIndex: S.segIndex };
          S.view = 'home'; render();
          break;
        case 'retry':
          S.paused = false;
          S.view = 'training';
          if (!S.remaining) S.remaining = segments()[S.segIndex].seconds;
          render();
          break;
        case 'reconnect': setView('home'); break;
        case 'back-detail': setView('detail'); break;
        case 'resume-course':
          S.course = courseById(S.pending.courseId);
          S.segIndex = Math.min(S.pending.segIndex, segments().length - 1);
          S.remaining = segments()[S.segIndex].seconds;
          S.elapsed = 0;
          S.paused = false;
          S.pending = null;
          S.view = 'training'; render();
          break;
        case 'continue-pending':
          S.course = courseById(S.pending.courseId);
          S.resumeIndex = S.pending.segIndex;
          S.view = 'resume'; render();
          break;
      }
    });
  }

  /* deep links for the shared state gallery */
  function bootFromHash() {
    var h = (location.hash || '').replace('#', '');
    S.course = hotelCourses[0];
    if (h === 'error') S.view = 'error';
    else if (h === 'offline') S.view = 'offline';
    else if (h === 'resume') {
      S.pending = { courseId: 'morning', segIndex: 2 };
      S.view = 'resume';
    } else if (h === 'training') {
      S.view = 'training';
      S.segIndex = 0;
      S.remaining = M.segmentsFor(S.course)[0].seconds;
    }
  }

  bootFromHash();
  render();
})();
</script>
</body>
</html>
